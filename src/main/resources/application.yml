
# Nuvia - MySQL 8.x
server:
  port: ${PORT:8080}
  error:
    include-message: never
  servlet:
    session:
      timeout: 45m
      cookie:
        http-only: true
        same-site: strict
        secure: ${NUVIA_SECURE_COOKIE:false}

spring:
  application:
    name: nuvia-banco

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:nuvia_db}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=REQUIRED&allowPublicKeyRetrieval=false"
    username: ${DB_USER:nuvia_app}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: America/Bahia

logging:
  level:
    org.hibernate.SQL: WARN
