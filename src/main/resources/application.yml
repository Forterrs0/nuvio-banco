server:
  port: ${PORT:8080}
  error:
    include-message: never
  servlet:
    session:
      timeout: 45m
      cookie:
        http-only: true
        same-site: strict
        secure: ${NUVIA_SECURE_COOKIE:false}
spring:
  application:
    name: nuvia-banco
  datasource:
    url: jdbc:h2:file:./data/nuvia;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ${NUVIA_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    time-zone: America/Bahia
logging:
  level:
    org.hibernate.SQL: WARN
