# Nuvia - banco MySQL 8.x (configuracao local)
# Usuario e senha MySQL entram por variaveis de ambiente.
# Nao comite credenciais em repositorios.
server:
  port: ${PORT:8080}
  error:
    include-message: never
  servlet:
    session:
      timeout: 45m
      cookie:
        http-only: true
        same-site: strict
        secure: ${NUVIA_SECURE_COOKIE:false}
spring:
  application:
    name: nuvia-banco
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: "jdbc:mysql://${NUVIA_DB_HOST:localhost}:${NUVIA_DB_PORT:3306}/${NUVIA_DB_NAME:nuvia_db}?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=${NUVIA_DB_SSL_MODE:PREFERRED}&allowPublicKeyRetrieval=${NUVIA_DB_ALLOW_PUBLIC_KEY_RETRIEVAL:false}"
    username: ${NUVIA_DB_USER:nuvia_app}
    password: ${NUVIA_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Bahia
logging:
  level:
    org.hibernate.SQL: WARN
