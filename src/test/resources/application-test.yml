# Testes de unidade/integracao rapidos rodam em H2 isolado em memoria.
# O aplicativo normal utiliza SOMENTE MySQL.
spring:
  flyway:
    enabled: false
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:nuvia_tests;DB_CLOSE_DELAY=-1
    username: sa
    password: ''
  jpa:
    hibernate:
      ddl-auto: create-drop
